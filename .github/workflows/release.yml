name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-submit:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Validate Signing Secrets
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=()
          for key in \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            MACOS_KEYCHAIN_PASSWORD \
            MACOS_SIGNING_IDENTITY \
            NOTARY_KEY_ID \
            NOTARY_ISSUER_ID \
            NOTARY_API_KEY_P8; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("${key}")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Import Signing Certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${RUNNER_TEMP}/build-signing.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/build-certificate.p12"

          echo "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${CERT_PATH}"

          security create-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${MACOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          CURRENT_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "${KEYCHAIN_PATH}" ${CURRENT_KEYCHAINS}
          security default-keychain -d user -s "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"

      - name: Build, Sign, and Submit for Notarization
        id: build
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DERIVED_DIR="${RUNNER_TEMP}/DerivedData"
          APP_PATH="${DERIVED_DIR}/Build/Products/Release/PortPeek.app"
          SIGNED_ZIP="${RUNNER_TEMP}/PortPeek-signed.zip"
          NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey_${NOTARY_KEY_ID}.p8"

          printf '%s' "${NOTARY_API_KEY_P8}" > "${NOTARY_KEY_PATH}"

          echo "==> Building"
          xcodebuild \
            -project "${GITHUB_WORKSPACE}/PortPeek.xcodeproj" \
            -scheme PortPeek \
            -configuration Release \
            -derivedDataPath "${DERIVED_DIR}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          [[ -d "${APP_PATH}" ]] || { echo "Build output missing: ${APP_PATH}"; exit 1; }

          echo "==> Signing"
          codesign \
            --force --deep --options runtime --timestamp \
            --sign "${MACOS_SIGNING_IDENTITY}" \
            "${APP_PATH}"
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"

          echo "==> Zipping signed app"
          ditto -c -k --keepParent "${APP_PATH}" "${SIGNED_ZIP}"
          cp "${SIGNED_ZIP}" "${GITHUB_WORKSPACE}/PortPeek-signed.zip"

          echo "==> Submitting for notarization (no-wait)"
          SUBMIT_OUTPUT=$(xcrun notarytool submit "${SIGNED_ZIP}" \
            --key "${NOTARY_KEY_PATH}" \
            --key-id "${NOTARY_KEY_ID}" \
            --issuer "${NOTARY_ISSUER_ID}" \
            --no-wait 2>&1)
          echo "${SUBMIT_OUTPUT}"

          SUBMISSION_ID=$(echo "${SUBMIT_OUTPUT}" | grep "  id:" | head -1 | awk '{print $2}')
          echo "submission_id=${SUBMISSION_ID}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          echo "## Build Complete — Notarization Pending" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Field | Value |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|---|---|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Submission ID | \`${SUBMISSION_ID}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Version | \`${VERSION}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Run ID | \`${GITHUB_RUN_ID}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Once Apple processes the submission, trigger the **Release Finalize** workflow with these values." >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Signed App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortPeek-signed-${{ github.ref_name }}
          path: PortPeek-signed.zip
          retention-days: 7
